<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yelim's Toolbox</title>
<meta name="description" content="내가 매일 쓰려고 만든 작은 웹 도구 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --ink: #1c1b19; --muted: #6b6860;
    --line: #e4e1d8; --accent: #2f5bd3; --accent-soft: #e6ecfb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131416; --surface: #1c1e21; --ink: #ecebe7; --muted: #9a978f;
            --line: #2c2f33; --accent: #7d9cff; --accent-soft: #1f2741; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 56px 16px 40px; }
  .eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
  h1 { font-size: clamp(28px, 5vw, 40px); margin: 8px 0 10px; font-weight: 800; letter-spacing: -.02em; }
  .lead { color: var(--muted); margin: 0 0 36px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
          padding: 22px; text-decoration: none; color: inherit; display: flex; flex-direction: column;
          gap: 10px; transition: transform .15s, border-color .15s; min-height: 190px; }
  a.card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft);
          display: grid; place-items: center; font-size: 22px; }
  .card h2 { font-size: 19px; margin: 4px 0 0; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .card.empty { border-style: dashed; background: transparent; justify-content: center; align-items: center;
                text-align: center; color: var(--muted); }
  footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">YELIM'S TOOLBOX</div>
  <h1>내가 매일 쓰는 도구들</h1>
  <p class="lead">필요할 때마다 하나씩 만들어 붙이는 개인 도구 모음. 전부 브라우저에서 돌아가고, 기록은 내 브라우저에 저장돼요.</p>

  <div class="grid">
    <a class="card" href="toeic/">
      <div class="icon">📘</div>
      <h2>토익 스터디</h2>
      <p>단어 플래시카드·퀴즈, 오답 단어 모아보기, 모의고사 점수 기록과 목표 850 추이, 시험 D-day.</p>
      <div class="tags"><span class="tag">단어장</span><span class="tag">점수 기록</span><span class="tag">D-day</span></div>
    </a>

    <!-- 새 도구 추가: 폴더 하나 만들고 아래처럼 카드 복사
    <a class="card" href="new-tool/">
      <div class="icon">🛠️</div>
      <h2>새 도구</h2>
      <p>설명</p>
      <div class="tags"><span class="tag">태그</span></div>
    </a>
    -->

    <div class="card empty">
      <div>➕<br><br>다음 도구 자리<br><small>폴더 추가 + 카드 한 장 → push</small></div>
    </div>
  </div>

  <footer>Hosted on GitHub Pages</footer>
</div>
</body>
</html>
